name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: rdm-windows
          - os: ubuntu-latest
            artifact: rdm-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p rdm

      - name: Extension checks (syntax + unit tests)
        if: runner.os == 'Linux'
        run: sh extension/test/check.sh

      - name: Extension builds (Firefox + Chromium) + lint
        if: runner.os == 'Linux'
        run: |
          sh packaging/firefox/build.sh
          sh packaging/chromium/build.sh
          npx --yes web-ext@8 lint --source-dir target/firefox

      - name: Dependency audit (RustSec)
        if: runner.os == 'Linux'
        run: cargo install cargo-audit --locked && cargo audit

      - name: Debian package
        if: runner.os == 'Linux'
        run: cargo install cargo-deb --locked && cargo deb -p rdm --no-build

      - name: Fedora package
        if: runner.os == 'Linux'
        run: cargo install cargo-generate-rpm --locked && cargo generate-rpm -p crates/app

      - name: Windows installer (WiX 3)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\wix.zip"
          Invoke-WebRequest https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip -OutFile $zip
          Expand-Archive $zip "$env:LOCALAPPDATA\Programs\wix3"
          powershell -ExecutionPolicy Bypass -File packaging/windows/build-msi.ps1 -NoBuild

      # Release Firefox installs only packages signed by Mozilla. With the repository secrets
      # AMO_JWT_ISSUER / AMO_JWT_SECRET (free addons.mozilla.org account, "unlisted": nothing is
      # published), tagged builds get a signed .xpi, which RDM installs for good in one click.
      - name: Stage
        shell: bash
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          mkdir dist
          if [ "$RUNNER_OS" = Windows ]; then
            cp RDM-*-x64.msi target/release/rdm.exe packaging/windows/install.ps1 dist/
          else
            mkdir rdm-linux-x64
            cp target/release/rdm crates/app/assets/rdm.png rdm-linux-x64/ && cp -r packaging/linux/. rdm-linux-x64/
            tar -czf dist/rdm-linux-x64.tar.gz rdm-linux-x64
            cp target/debian/*.deb target/generate-rpm/*.rpm dist/
            cp target/rdm-chromium.zip dist/
            if [ -n "$AMO_JWT_ISSUER" ] && [ -n "$AMO_JWT_SECRET" ] && [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
              npx --yes web-ext@8 sign --channel=unlisted --source-dir target/firefox --artifacts-dir target/signed \
                --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
              cp target/signed/*.xpi dist/rdm-firefox.xpi
            else
              (cd target/firefox && zip -qr ../../dist/rdm-firefox.xpi .)
            fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.msi
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.xpi
            dist/*.zip
