[workspace]
resolver = "3"
members = ["crates/domain", "crates/engine", "crates/app"]

[workspace.package]
version = "0.3.5"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/vincentxjoubert-lang/rdm"

[workspace.dependencies]
domain = { path = "crates/domain" }
engine = { path = "crates/engine" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync", "net"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "socks", "system-proxy"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
